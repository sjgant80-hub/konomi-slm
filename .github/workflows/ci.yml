name: gate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit tests
        run: node --test
      - name: measured report
        run: node tools/run.mjs
      - name: ladder report (tier 1 builds tier 2)
        run: node tools/run-tier.mjs
      - name: multiplier receipt re-scored with no model
        run: |
          if [ -f receipts/multiplier.json ] && grep -q '"finishedAt"' receipts/multiplier.json; then
            node tools/check-multiplier.mjs
          else
            echo "multiplier: sealed in CLAIMS-MULTIPLIER.md, run not yet committed"
          fi
      - name: fetch the mutation gate (witness, pinned v0.6)
        run: git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git "$RUNNER_TEMP/witness"
      - name: mutation gate (kernel)
        run: node "$RUNNER_TEMP/witness/witness.mjs" mutate konomi-slm.mjs --cap 400 --baseline witness.baseline.json --timeout 60000 --test node --test tests/konomi-slm.test.mjs > witness.out.json
      - name: mutation gate (growth engine)
        run: node "$RUNNER_TEMP/witness/witness.mjs" mutate grow-tier.mjs --cap 400 --baseline witness-tier.baseline.json --timeout 60000 --test node --test tests/grow-tier.test.mjs > witness-tier.out.json
      - name: mutation gate (your-brain, queue 11 the product)
        run: node "$RUNNER_TEMP/witness/witness.mjs" mutate tools/your-brain.mjs --cap 400 --timeout 240000 --test node --test tests/your-brain.test.mjs > witness-brain.out.json
      - name: konomi-slm as a node of the shared foundation - the adapter's mutation gate
        run: node "$RUNNER_TEMP/witness/witness.mjs" mutate node/konomi-node.mjs --cap 400 --timeout 240000 --test node --test node/konomi-node.test.mjs > witness-node.out.json
      - name: mutation gate (the multiplier scoring kernel)
        run: node "$RUNNER_TEMP/witness/witness.mjs" mutate tools/multiplier.mjs --cap 400 --baseline witness-multiplier.baseline.json --timeout 120000 --test node --test tests/multiplier.test.mjs > witness-multiplier.out.json
      - name: mutation gate (the cost case in the brochure)
        run: node "$RUNNER_TEMP/witness/witness.mjs" mutate costcase.mjs --cap 400 --timeout 60000 --test node --test tests/costcase.test.mjs > witness-costcase.out.json
      - name: refuse anything short of clean
        run: |
          node scripts/check-clean.mjs witness.out.json
          node scripts/check-clean.mjs witness-tier.out.json
          node scripts/check-clean.mjs witness-brain.out.json
          node scripts/check-clean.mjs witness-node.out.json
          node scripts/check-clean.mjs witness-multiplier.out.json
          node scripts/check-clean.mjs witness-costcase.out.json
