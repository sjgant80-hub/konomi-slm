name: gate
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: unit tests
        run: node --test
      - name: measured report (reproduce the numbers)
        run: node tools/run.mjs
      - name: mutation gate (mutate the kernel — the tests must catch every change)
        run: node tools/witness.mjs mutate konomi-slm.mjs --cap 400 --baseline witness.baseline.json --timeout 60000 --test node --test tests/konomi-slm.test.mjs > witness.out.json
      - name: refuse anything short of clean
        run: node -e "const w=require('./witness.out.json');if(!w.clean){console.error('witness NOT clean: '+(w.survived||[]).length+' survivor(s)');process.exit(1)}console.log('witness clean · score '+w.score)"
