name: gate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit tests
        run: node --test
      - name: measured report
        run: node tools/run.mjs
      - name: mutation gate
        run: node tools/witness.mjs mutate konomi-slm.mjs --cap 400 --baseline witness.baseline.json --timeout 60000 --test node --test tests/konomi-slm.test.mjs > witness.out.json
      - name: refuse anything short of clean
        run: node scripts/check-clean.mjs
