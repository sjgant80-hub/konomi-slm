name: gate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: unit tests
        run: node --test
      - name: measured report
        run: node tools/run.mjs
      - name: ladder report (tier 1 builds tier 2)
        run: node tools/run-tier.mjs
      - name: mutation gate (kernel)
        run: node tools/witness.mjs mutate konomi-slm.mjs --cap 400 --baseline witness.baseline.json --timeout 60000 --test node --test tests/konomi-slm.test.mjs > witness.out.json
      - name: mutation gate (growth engine)
        run: node tools/witness.mjs mutate grow-tier.mjs --cap 400 --baseline witness-tier.baseline.json --timeout 60000 --test node --test tests/grow-tier.test.mjs > witness-tier.out.json
      - name: mutation gate (your-brain, queue 11 the product)
        run: node tools/witness.mjs mutate tools/your-brain.mjs --cap 400 --timeout 240000 --test node --test tests/your-brain.test.mjs > witness-brain.out.json
      - name: refuse anything short of clean
        run: |
          node scripts/check-clean.mjs witness.out.json
          node scripts/check-clean.mjs witness-tier.out.json
          node scripts/check-clean.mjs witness-brain.out.json
